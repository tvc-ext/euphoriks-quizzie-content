name: Generate Quizzie Question Packs

on:
  push:
    branches: [content/quizzie-question-diversity]
    paths:
      - "source/**"
      - "scripts/generate_quizzie_questions.py"
      - "scripts/validate_content.py"
      - ".github/workflows/generate-question-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate question packs
        run: python scripts/generate_quizzie_questions.py

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Commit generated packs
        run: |
          if git diff --quiet -- questions; then
            echo "Question packs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions
          git commit -m "Generate richer Quizzie question packs [skip ci]"
          git push
